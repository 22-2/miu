name: Build (Windows)

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - 'macOS/**'
      - 'Android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Unit tests for the fork's Win32-free code (fork/tests). cl.exe is only on PATH
  # inside a Visual Studio developer shell, so enter one first.
  test:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - name: Run fork unit tests
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($test in Get-ChildItem "$env:GITHUB_WORKSPACE\fork\tests" -Filter *_test.cpp) {
            cl /nologo /std:c++17 /EHsc /W4 /WX $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "compile failed: $($test.Name)" }
            & ".\$($test.BaseName).exe"
            if ($LASTEXITCODE -ne 0) { throw "tests failed: $($test.Name)" }
          }

  build:
    needs: test
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      # miu.vcxproj links ced.lib from lib/ (see README). Build it with the static
      # CRT (/MT) to match miu's Release config; the CMake default (/MD) causes LNK2038.
      # Its CMakeLists checks paths relative to the current directory, so configure in-source.
      # The -D arguments are quoted because pwsh splits unquoted "=3.5" into "=3" and ".5".
      # An empty gtest/ skips its googletest download, which points at the removed
      # "master" branch; only the ced target is needed here.
      - name: Build compact_enc_det
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 https://github.com/google/compact_enc_det.git ced
          Set-Location ced
          New-Item -ItemType Directory gtest | Out-Null
          cmake . -G "Visual Studio 18 2026" -A x64 `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            "-DCMAKE_POLICY_DEFAULT_CMP0091=NEW" `
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
          cmake --build . --config Release --target ced

      - name: Place ced.lib
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force lib | Out-Null
          $ced = Get-ChildItem "$env:RUNNER_TEMP/ced/lib" -Recurse -Filter ced.lib | Select-Object -First 1
          if (-not $ced) { throw 'ced.lib was not built' }
          Copy-Item $ced.FullName lib/ced.lib

      - uses: microsoft/setup-msbuild@v2

      # Build the vcxproj directly: miu.sln also contains the MSIX package project,
      # which needs signing and is not required for miu.exe.
      - name: Build miu
        run: msbuild miu.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - uses: actions/upload-artifact@v4
        with:
          name: miu-win-x64
          path: x64/Release/miu.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: x64/Release/miu.exe
